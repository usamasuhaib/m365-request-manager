<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M365 Request Manager</title>
    <!-- Guard against Office.js overriding history methods outside Office clients -->
    <script type="text/javascript">
      window._backupReplaceState = window.history.replaceState;
      window._backupPushState = window.history.pushState;
    </script>
    <!-- Include Office.js script for Outlook Task Pane integration -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <script type="text/javascript">
      if (window._backupReplaceState) {
        window.history.replaceState = window._backupReplaceState;
      }
      if (window._backupPushState) {
        window.history.pushState = window._backupPushState;
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
